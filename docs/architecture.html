  #diagram { width: 100%; height: 100%; display: block; user-select: none; }

<header>
  <h1>Distributed Job Processor — Architecture</h1>
  <p>Two of N identical Spring Boot instances sharing one PostgreSQL database. Component names are the actual classes.
     Written explanation: <a href="ARCHITECTURE.md">ARCHITECTURE.md</a>.</p>

</header>

<script>
(function () {
  var svg = document.getElementById('diagram');
  var viewport = document.getElementById('viewport');
  var level = document.getElementById('zoom-level');
  var FULL = { x: 0, y: 0, w: 1680, h: 1230 };
  var view = { x: FULL.x, y: FULL.y, w: FULL.w, h: FULL.h };

  function apply() {
    svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + view.w + ' ' + view.h);
    var r = viewport.getBoundingClientRect();
    var scale = Math.min(r.width / view.w, r.height / view.h);
    level.textContent = Math.round(scale * 100) + '%';
  }
  function fit() { view = { x: FULL.x, y: FULL.y, w: FULL.w, h: FULL.h }; apply(); }
  function actualSize() {
    var r = viewport.getBoundingClientRect();
    view = { x: 0, y: 0, w: r.width, h: r.height }; apply();
  }
  function zoom(factor, cx, cy) {
    var r = viewport.getBoundingClientRect();
    var px = cx === undefined ? 0.5 : (cx - r.left) / r.width;
    var py = cy === undefined ? 0.5 : (cy - r.top) / r.height;
    var nw = Math.min(Math.max(view.w / factor, 200), FULL.w * 4);
    var nh = nw * (view.h / view.w);
    view.x += (view.w - nw) * px; view.y += (view.h - nh) * py;
    view.w = nw; view.h = nh; apply();
  }
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive: false });
  var drag = null;
  viewport.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = viewport.getBoundingClientRect();
    var s = Math.max(view.w / r.width, view.h / r.height);
    view.x = drag.vx - (e.clientX - drag.x) * s; view.y = drag.vy - (e.clientY - drag.y) * s; apply();
  });
  function endDrag() { drag = null; viewport.classList.remove('dragging'); }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
  document.getElementById('zoom-in').addEventListener('click', function () { zoom(1.25); });
  document.getElementById('zoom-out').addEventListener('click', function () { zoom(1 / 1.25); });
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('actual').addEventListener('click', actualSize);
  window.addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') zoom(1.25);
    else if (e.key === '-') zoom(1 / 1.25);
    else if (e.key === '0') fit();
    else if (e.key === '1') actualSize();
  });
  window.addEventListener('resize', apply);
  fit();
})();
</script>
