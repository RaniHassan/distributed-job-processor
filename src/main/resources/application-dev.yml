# Local development. Defaults point at the PostgreSQL container from docker-compose.yml;
# when running inside Compose, the SPRING_DATASOURCE_* environment variables take precedence.

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:jobprocessor}
    username: ${POSTGRES_USER:jobprocessor}
    password: ${POSTGRES_PASSWORD}

jobprocessor:
  simulation:
    failure-injection-enabled: true
  # Test users created at startup (dev/test only). Passwords must come from the environment;
  # startup fails if a SEED_*_PASSWORD variable is missing.
  seed:
    users:
      - username: ${SEED_USER_USERNAME:alice}
        password: ${SEED_USER_PASSWORD}
        role: USER
      - username: ${SEED_ADMIN_USERNAME:admin}
        password: ${SEED_ADMIN_PASSWORD}
        role: ADMIN
