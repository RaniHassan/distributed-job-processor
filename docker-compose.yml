# Local environment: one PostgreSQL database shared by two application instances.
# Copy .env.example to .env and set POSTGRES_PASSWORD before running `docker compose up`.

name: job-processor

x-app: &app
  build: .
  image: distributed-job-processor:local
  depends_on:
    postgres:
      condition: service_healthy
  # Longer than jobprocessor.shutdown.timeout (30s) so in-flight jobs can drain on `docker compose stop`.
  stop_grace_period: 45s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 60s
  restart: unless-stopped

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobprocessor}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobprocessor}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobprocessor}
      POSTGRES_USER: ${POSTGRES_USER:-jobprocessor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports:
      - "127.0.0.1:${APP1_PORT:-8081}:8080"

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "127.0.0.1:${APP2_PORT:-8082}:8080"

volumes:
  pgdata:
